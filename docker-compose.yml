services:
  tividy:
    build: .
    image: tividy
    container_name: tividy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - tividy-data:/data
    environment:
      TIVIDY_SCENARIO: acme-software.txt
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  tividy-data:

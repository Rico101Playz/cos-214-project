name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run the tests (GoogleTest through CTest)
        run: ctest --test-dir build --output-on-failure

      - name: Write a GoogleTest XML report
        if: always()
        run: ./build/TIVIDY_Tests --gtest_output=xml:build/test-results.xml

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.xml

      - name: Keep the app binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tividy-linux
          path: build/TIVIDY_App